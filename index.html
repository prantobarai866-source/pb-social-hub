  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game-canvas");
      const stage = document.querySelector(".game-stage");
      const ctx = canvas && canvas.getContext("2d");
      const scoreDisplay = document.getElementById("score-display");
      const livesDisplay = document.getElementById("lives-display");
      const bestDisplay = document.getElementById("best-display");
      const speedDisplay = document.getElementById("speed-display");
      const promptDisplay = document.getElementById("drive-prompt");
      const overlay = document.getElementById("gameover-overlay");
      const finalScore = document.getElementById("final-score");
      const finalBest = document.getElementById("final-best");
      const restartButton = document.getElementById("restart-btn");
      const leftButton = document.getElementById("left-control");
      const rightButton = document.getElementById("right-control");

      if (!canvas || !stage || !ctx) return;

      let width = 0, height = 0, dpr = 1, rafId = 0, lastFrame = 0;
      let gameStarted = false, gameOver = false, paused = false;
      let score = 0, bestScore = 0, lives = 3, level = 1, speed = .7;
      let targetLane = 1, carLane = 1, roadFlow = 0, spawnClock = 0;
      let shake = 0, flash = 0, invulnerable = 0, carBounce = 0;
      let entities = [], particles = [], popups = [];

      const laneCount = 3;
      const candyColors = ["#ff5cab", "#ffd45d", "#3ff5db", "#9d7dff", "#ff8e50"];
      const people = Array.from({ length: 34 }, (_, i) => ({
        seed: i * 91.27,
        side: i % 2 ? 1 : -1,
        outfit: ["#fb5aa6", "#2dd8cb", "#ffd05b", "#7456d9", "#ff7b4f"][i % 5],
        skin: ["#f6c7a4", "#a96e4c", "#76452e", "#db9b73"][i % 4],
        wave: i % 5 === 0
      }));

      try { bestScore = Number(localStorage.getItem("candy-road-best") || 0); } catch (_) {}

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(320, rect.width);
        height = Math.max(420, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function horizon() { return height * .205; }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function depthY(z) { return horizon() + Math.pow(clamp(z, 0, 1), 1.56) * (height - horizon()); }

      function roadAt(y) {
        const h = horizon();
        const t = clamp((y - h) / (height - h), 0, 1);
        const curve = Math.pow(t, 1.58);
        const center = width * .5 + Math.sin(roadFlow * .00108) * curve * width * .035;
        const half = width * (.067 + curve * .535);
        return { t, center, left: center - half, right: center + half, half };
      }

      function laneX(lane, y) {
        const road = roadAt(y);
        return road.left + road.half * ((lane + .5) / laneCount * 2);
      }

      function updateHud() {
        if (scoreDisplay) scoreDisplay.textContent = `SCORE: ${score.toLocaleString("en-US")} 🍬`;
        if (bestDisplay) bestDisplay.textContent = `BEST: ${bestScore.toLocaleString("en-US")}`;
        if (speedDisplay) speedDisplay.textContent = `SPEED: ${Math.round(speed * 100)} · LEVEL ${level}`;
        if (livesDisplay) livesDisplay.textContent = `LIVES: ${lives ? "♥ ".repeat(lives).trim() : "—"}`;
      }

      function saveBest() {
        if (score <= bestScore) return;
        bestScore = score;
        try { localStorage.setItem("candy-road-best", String(bestScore)); } catch (_) {}
      }

      function startGame() {
        if (gameStarted || gameOver) return;
        gameStarted = true;
        if (promptDisplay) promptDisplay.classList.add("is-hidden");
      }

      function moveLane(direction) {
        if (gameOver) return;
        startGame();
        targetLane = clamp(targetLane + direction, 0, laneCount - 1);
      }

      function addParticles(x, y, color, amount, force) {
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = (40 + Math.random() * 175) * force;
          particles.push({
            x, y, color,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity - 45,
            size: 1.5 + Math.random() * 5,
            life: .35 + Math.random() * .55,
            max: .9
          });
        }
      }

      function addPopup(x, y, text, color) {
        popups.push({ x, y, text, color, life: .95, max: .95 });
      }

      function spawnEntity() {
        const roll = Math.random();
        const kind = roll < .5 ? "candy" : roll < .78 ? "obstacle" : "heart";
        entities.push({
          lane: Math.floor(Math.random() * laneCount),
          z: .025,
          kind,
          color: candyColors[Math.floor(Math.random() * candyColors.length)],
          rotation: Math.random() * Math.PI * 2,
          hit: false
        });
      }

      function collectCandy(entity, x, y) {
        entity.hit = true;
        const points = 20 + level * 3;
        score += points;
        saveBest();
        addParticles(x, y, entity.color, 22, 1.15);
        addPopup(x, y, `+${points}`, "#fff2a5");
      }

      function collectHeart(entity, x, y) {
        entity.hit = true;
        if (lives < 3) lives += 1;
        addParticles(x, y, "#ff629f", 28, 1.4);
        addPopup(x, y, "LIFE +1", "#ffe1ef");
      }

      function collide(entity, x, y) {
        if (invulnerable > 0) return;
        entity.hit = true;
        lives = Math.max(0, lives - 1);
        invulnerable = 1.05;
        shake = 19;
        flash = .72;
        addParticles(x, y, "#ff503f", 34, 1.55);
        addPopup(x, y, "CRASH!", "#fff3dd");
        if (lives === 0) triggerGameOver();
      }

      function triggerGameOver() {
        gameOver = true;
        paused = true;
        saveBest();
        updateHud();
        if (finalScore) finalScore.textContent = `SCORE: ${score.toLocaleString("en-US")}`;
        if (finalBest) finalBest.textContent = `BEST: ${bestScore.toLocaleString("en-US")}`;
        if (overlay) {
          overlay.classList.add("is-visible");
          overlay.setAttribute("aria-hidden", "false");
        }
      }

      function restartGame() {
        score = 0; lives = 3; level = 1; speed = .7;
        targetLane = 1; carLane = 1; roadFlow = 0; spawnClock = 0;
        shake = 0; flash = 0; invulnerable = 0; carBounce = 0;
        entities = []; particles = []; popups = [];
        gameStarted = false; gameOver = false; paused = false;
        if (overlay) {
          overlay.classList.remove("is-visible");
          overlay.setAttribute("aria-hidden", "true");
        }
        if (promptDisplay) promptDisplay.classList.remove("is-hidden");
        updateHud();
      }
      window.restartGame = restartGame;

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#6bc5e4");
        sky.addColorStop(.33, "#d799d1");
        sky.addColorStop(.62, "#f7b6a7");
        sky.addColorStop(1, "#614052");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const sunX = width * .18, sunY = height * .13;
        const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, height * .2);
        glow.addColorStop(0, "rgba(255,255,211,.98)");
        glow.addColorStop(.22, "rgba(255,218,145,.65)");
        glow.addColorStop(1, "rgba(255,180,160,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height * .48);
        ctx.fillStyle = "#fff3a8";
        ctx.beginPath(); ctx.arc(sunX, sunY, height * .036, 0, Math.PI * 2); ctx.fill();

        for (let i = 0; i < 12; i++) {
          const x = ((i * 147 - roadFlow * (.018 + (i % 3) * .008)) % (width + 170)) - 70;
          const y = height * (.045 + (i % 4) * .045);
          ctx.fillStyle = "rgba(255,255,255,.54)";
          ctx.beginPath();
          ctx.ellipse(x, y, 27, 12, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 25, y - 5, 24, 17, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 51, y + 2, 32, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const haze = ctx.createLinearGradient(0, horizon() - 12, 0, horizon() + 100);
        haze.addColorStop(0, "rgba(255,232,246,.58)");
        haze.addColorStop(1, "rgba(255,232,246,0)");
        ctx.fillStyle = haze;
        ctx.fillRect(0, horizon() - 20, width, 120);
      }

      function drawDistantTown() {
        const h = horizon();
        ctx.fillStyle = "#84b89c";
        ctx.beginPath();
        ctx.moveTo(0, h + 10);
        ctx.quadraticCurveTo(width * .17, h - 27, width * .35, h + 17);
        ctx.quadraticCurveTo(width * .67, h - 30, width, h + 13);
        ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.fill();

        for (let i = 0; i < 18; i++) {
          const side = i % 2 ? 1 : -1;
          const x = side < 0 ? width * (.03 + (i % 5) * .06) : width * (.68 + (i % 5) * .065);
          const y = h - 4 - (i % 3) * 7;
          ctx.fillStyle = ["#ff83be", "#5ae6d3", "#ffe17d"][i % 3];
          ctx.fillRect(x, y, 11 + (i % 4) * 4, 12 + (i % 3) * 7);
          ctx.fillStyle = "rgba(255,255,255,.56)";
          ctx.fillRect(x + 3, y + 3, 3, 4);
        }
      }

      function drawRoad() {
        const h = horizon(), top = roadAt(h), bottom = roadAt(height);
        const shoulder = ctx.createLinearGradient(0, h, 0, height);
        shoulder.addColorStop(0, "#d8a7ba");
        shoulder.addColorStop(1, "#70405b");
        ctx.fillStyle = shoulder;
        ctx.fillRect(0, h, width, height - h);

        const road = ctx.createLinearGradient(0, h, 0, height);
        road.addColorStop(0, "#6e4155");
        road.addColorStop(.42, "#2b1b28");
        road.addColorStop(1, "#100b12");
        ctx.fillStyle = road;
        ctx.beginPath();
        ctx.moveTo(top.left, h); ctx.lineTo(top.right, h);
        ctx.lineTo(bottom.right, height); ctx.lineTo(bottom.left, height);
        ctx.closePath(); ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(top.left, h); ctx.lineTo(top.right, h); ctx.lineTo(bottom.right, height); ctx.lineTo(bottom.left, height); ctx.closePath();
        ctx.clip();

        for (let i = 0; i < 28; i++) {
          const z = (i * .048 + roadFlow * .0007) % 1;
          const y = depthY(z);
          const r = roadAt(y);
          ctx.strokeStyle = `rgba(255,205,225,${.025 + z * .065})`;
          ctx.lineWidth = 1 + z * 2;
          ctx.beginPath(); ctx.moveTo(r.left, y); ctx.lineTo(r.right, y); ctx.stroke();
        }

        for (let lane = 1; lane < laneCount; lane++) {
          for (let i = 0; i < 9; i++) {
            const z1 = (i * .13 + roadFlow * .00085) % 1;
            const z2 = Math.min(1, z1 + .058);
            const y1 = depthY(z1), y2 = depthY(z2);
            ctx.strokeStyle = "rgba(255,247,238,.9)";
            ctx.shadowColor = "rgba(255,225,255,.55)";
            ctx.shadowBlur = 6;
            ctx.lineWidth = 1 + z1 * 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(laneX(lane - .5, y1), y1);
            ctx.lineTo(laneX(lane - .5, y2), y2);
            ctx.stroke();
          }
        }
        ctx.restore();
        ctx.shadowBlur = 0;

        [0, 1].forEach(side => {
          for (let i = 0; i < 20; i++) {
            const z = (i * .057 + roadFlow * .00108) % 1;
            const y = depthY(z), r = roadAt(y);
            const x = side ? r.right : r.left;
            const radius = 1.2 + z * 6;
            ctx.fillStyle = i % 2 ? "#42f4df" : "#ff72b9";
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 7 + z * 11;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
          }
        });
        ctx.shadowBlur = 0;
      }

      function drawRoadsideObject(x, y, s, side, type) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.globalAlpha = clamp(.38 + s * .44, 0, 1);
        ctx.fillStyle = "rgba(20,8,19,.28)";
        ctx.beginPath(); ctx.ellipse(0, 14, 27, 7, 0, 0, Math.PI * 2); ctx.fill();

        if (type === 0) {
          ctx.strokeStyle = "#754b65"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(0, 15); ctx.lineTo(0, -30); ctx.stroke();
          ctx.fillStyle = "#f9df93";
          ctx.shadowColor = "#ffe88b"; ctx.shadowBlur = 16;
          ctx.beginPath(); ctx.arc(0, -32, 9, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        } else if (type === 1) {
          ctx.fillStyle = "#f4c772";
          ctx.fillRect(-26, -8, 52, 30);
          ctx.fillStyle = "#ff6eb2";
          ctx.beginPath(); ctx.moveTo(-31, -8); ctx.lineTo(0, -31); ctx.lineTo(31, -8); ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#63e7d6"; ctx.fillRect(-15, 0, 12, 12); ctx.fillRect(5, 0, 12, 12); ctx.fill();
          ctx.fillStyle = "#fff6d3"; ctx.fillRect(-19, -18, 38, 5); ctx.fill();
        } else if (type === 2) {
          ctx.fillStyle = "#9a6647";
          ctx.fillRect(-20, 3, 40, 6);
          ctx.fillRect(-15, 9, 4, 14); ctx.fillRect(11, 9, 4, 14);
          ctx.fillStyle = "#49bf78";
          ctx.beginPath(); ctx.arc(0, -7, 19, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = "#e5e8ea"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-24, 20); ctx.lineTo(-24, -5); ctx.lineTo(24, -5); ctx.lineTo(24, 20); ctx.stroke();
        }
        ctx.restore();
      }

      function drawPedestrian(person, z, time) {
        const y = depthY(z);
        const r = roadAt(y);
        const s = .12 + z * .84;
        const offset = 24 + z * width * .14;
        const x = person.side < 0 ? r.left - offset : r.right + offset;
        const walk = Math.sin(time * .006 + person.seed) * 5;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.globalAlpha = clamp(.38 + z * .68, 0, 1);

        ctx.fillStyle = "rgba(20,10,20,.28)";
        ctx.beginPath(); ctx.ellipse(0, 20, 13, 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = "#243041"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-4, 11); ctx.lineTo(-7 + walk * .35, 25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(4, 11); ctx.lineTo(7 - walk * .35, 25); ctx.stroke();

        ctx.fillStyle = person.outfit;
        ctx.beginPath(); ctx.roundRect(-10, -9, 20, 23, 6); ctx.fill();

        ctx.strokeStyle = person.skin; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(-17, 6 + walk * .2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(9, -3);
        ctx.lineTo(person.wave ? 16 : 15, person.wave ? -14 + walk * .2 : 7 - walk * .2);
        ctx.stroke();

        ctx.fillStyle = person.skin;
        ctx.beginPath(); ctx.arc(0, -18, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#51323b";
        ctx.beginPath(); ctx.arc(0, -21, 8.5, Math.PI, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawRoadside(time) {
        for (let i = 0; i < 30; i++) {
          const z = (i * .071 + roadFlow * .00029) % 1;
          const y = depthY(z);
          const r = roadAt(y);
          const side = i % 2 ? 1 : -1;
          const x = side < 0 ? r.left - (18 + z * width * .13) : r.right + (18 + z * width * .13);
          drawRoadsideObject(x, y, .15 + z * .9, side, i % 4);
        }

        people.forEach((person, index) => {
          const z = (index * .103 + roadFlow * .00022) % 1;
          if (z > .08) drawPedestrian(person, z, time);
        });
      }

      function drawEntity(entity) {
        const y = depthY(entity.z);
        const x = laneX(entity.lane, y);
        const s = .16 + entity.z * 1.27;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.rotate(Math.sin(entity.rotation) * .12);

        ctx.fillStyle = "rgba(0,0,0,.3)";
        ctx.beginPath(); ctx.ellipse(0, 29, 29, 8, 0, 0, Math.PI * 2); ctx.fill();

        if (entity.kind === "candy") {
          ctx.shadowColor = entity.color; ctx.shadowBlur = 22;
          const g = ctx.createRadialGradient(-7, -9, 2, 0, 0, 25);
          g.addColorStop(0, "#fff9e9"); g.addColorStop(.25, entity.color); g.addColorStop(1, "#9c2b78");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, 23, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#fff4ef"; ctx.fillRect(-23, -4, 46, 8);
        } else if (entity.kind === "heart") {
          ctx.shadowColor = "#ff5999"; ctx.shadowBlur = 25;
          ctx.fillStyle = "#ff5f9e";
          ctx.beginPath();
          ctx.moveTo(0, 22); ctx.bezierCurveTo(-38, 0, -21, -27, 0, -10);
          ctx.bezierCurveTo(21, -27, 38, 0, 0, 22); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255,255,255,.62)";
          ctx.beginPath(); ctx.ellipse(-8, -7, 6, 4, -.5, 0, Math.PI * 2); ctx.fill();
        } else {
          const g = ctx.createLinearGradient(-25, -20, 26, 28);
          g.addColorStop(0, "#ffdfa0"); g.addColorStop(.32, "#ff754f"); g.addColorStop(1, "#8f263d");
          ctx.fillStyle = g;
          ctx.shadowColor = "#ff784d"; ctx.shadowBlur = 13;
          ctx.beginPath(); ctx.roundRect(-23, -15, 46, 46, 13); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#fff1d4";
          ctx.beginPath(); ctx.arc(-8, 3, 3, 0, Math.PI * 2); ctx.arc(8, 3, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
        return { x, y };
      }

      function drawCar() {
        const y = height * .79 + Math.sin(carBounce) * 2;
        const x = laneX(carLane, y);
        const s = Math.min(width, height) * .115;
        const steering = (targetLane - carLane) * -.2;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(steering);

        if (gameStarted && speed > .82) {
          for (let i = 0; i < 8; i++) {
            ctx.strokeStyle = `rgba(224,255,255,${.025 + i * .011})`;
            ctx.lineWidth = 1 + i * .7;
            ctx.beginPath();
            ctx.moveTo(-s * (.7 + i * .06), s * (.1 + i * .045));
            ctx.lineTo(-s * (2.1 + i * .25), s * (.38 + i * .09));
            ctx.stroke();
          }
        }

        const reflection = ctx.createRadialGradient(0, s * .5, 1, 0, s * .5, s * 1.35);
        reflection.addColorStop(0, "rgba(255,66,150,.33)");
        reflection.addColorStop(1, "rgba(255,66,150,0)");
        ctx.fillStyle = reflection;
        ctx.beginPath(); ctx.ellipse(0, s * .63, s * .92, s * .3, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "rgba(2,2,8,.64)";
        ctx.beginPath(); ctx.ellipse(0, s * .48, s * .78, s * .22, 0, 0, Math.PI * 2); ctx.fill();

        [-1, 1].forEach(side => {
          ctx.fillStyle = "#11121b";
          ctx.beginPath(); ctx.roundRect(side * s * .5 - s * .11, -s * .12, s * .22, s * .63, s * .075); ctx.fill();
          ctx.fillStyle = "#5c6571";
          ctx.beginPath(); ctx.arc(side * s * .5, s * .28, s * .105, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#151923";
          ctx.beginPath(); ctx.arc(side * s * .5, s * .28, s * .055, 0, Math.PI * 2); ctx.fill();
        });

        const body = ctx.createLinearGradient(-s, -s * .6, s, s * .65);
        body.addColorStop(0, "#ffe6f2");
        body.addColorStop(.12, "#ff82c4");
        body.addColorStop(.42, "#e82a81");
        body.addColorStop(.73, "#9b1d5c");
        body.addColorStop(1, "#4b1636");
        ctx.fillStyle = body;
        ctx.shadowColor = "#ff4da7"; ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(-s*.62, s*.32);
        ctx.lineTo(-s*.48, -s*.34);
        ctx.quadraticCurveTo(0, -s*.76, s*.48, -s*.34);
        ctx.lineTo(s*.62, s*.32);
        ctx.quadraticCurveTo(s*.34, s*.57, 0, s*.58);
        ctx.quadraticCurveTo(-s*.34, s*.57, -s*.62, s*.32);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "rgba(255,255,255,.27)";
        ctx.beginPath();
        ctx.moveTo(-s*.42, -s*.3); ctx.quadraticCurveTo(0, -s*.62, s*.15, -s*.47);
        ctx.lineTo(-s*.05, -s*.16); ctx.lineTo(-s*.34, -s*.08); ctx.closePath(); ctx.fill();

        const glass = ctx.createLinearGradient(-s*.23, -s*.5, s*.2, 0);
        glass.addColorStop(0, "rgba(224,255,255,.88)");
        glass.addColorStop(.25, "rgba(75,212,239,.52)");
        glass.addColorStop(.7, "rgba(18,38,76,.9)");
        glass.addColorStop(1, "rgba(9,15,38,.96)");
        ctx.fillStyle = glass;
        ctx.beginPath();
        ctx.moveTo(-s*.28, -s*.34); ctx.lineTo(0, -s*.57); ctx.lineTo(s*.28, -s*.34);
        ctx.lineTo(s*.18, -s*.06); ctx.lineTo(-s*.18, -s*.06); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#ff85be";
        ctx.beginPath(); ctx.ellipse(-s*.62, -s*.04, s*.12, s*.06, -.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*.62, -s*.04, s*.12, s*.06, .3, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#fff7bd";
        ctx.shadowColor = "#fff1aa"; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.roundRect(-s*.41, -.01*s, s*.15, s*.11, s*.03); ctx.fill();
        ctx.beginPath(); ctx.roundRect(s*.26, -.01*s, s*.15, s*.11, s*.03); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#37f0dd";
        ctx.beginPath(); ctx.roundRect(-s*.4, s*.13, s*.15, s*.08, s*.03); ctx.fill();
        ctx.beginPath(); ctx.roundRect(s*.25, s*.13, s*.15, s*.08, s*.03); ctx.fill();

        ctx.fillStyle = "#ff345d";
        ctx.shadowColor = "#ff395f"; ctx.shadowBlur = 13;
        ctx.fillRect(-s*.31, s*.32, s*.14, s*.07);
        ctx.fillRect(s*.17, s*.32, s*.14, s*.07);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "#ffe16c"; ctx.lineWidth = Math.max(2, s*.03);
        ctx.beginPath(); ctx.moveTo(-s*.17, s*.43); ctx.lineTo(s*.17, s*.43); ctx.stroke();
        ctx.restore();
      }

      function updateParticles(delta) {
        particles.forEach(p => {
          p.x += p.vx * delta; p.y += p.vy * delta; p.vy += 160 * delta; p.life -= delta;
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        particles = particles.filter(p => p.life > 0);
        ctx.globalAlpha = 1;
      }

      function updatePopups(delta) {
        popups.forEach(p => {
          p.y -= 48 * delta; p.life -= delta;
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.font = "900 20px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(p.text, p.x, p.y);
        });
        popups = popups.filter(p => p.life > 0);
        ctx.globalAlpha = 1;
      }

      function update(delta, timestamp) {
        if (paused) return;

        roadFlow += (gameStarted ? speed * 420 : 20) * delta;
        shake = Math.max(0, shake - delta * 40);
        flash = Math.max(0, flash - delta * 1.9);
        invulnerable = Math.max(0, invulnerable - delta);
        carBounce += delta * (gameStarted ? speed * 8 : 2);

        if (!gameStarted) return;

        speed += (.86 + Math.min(score / 5200, .9) - speed) * Math.min(1, delta * 1.25);
        level = Math.max(1, Math.floor(score / 210) + 1);
        carLane += (targetLane - carLane) * Math.min(1, delta * 11);

        spawnClock += delta * 1000;
        if (spawnClock > Math.max(420, 970 - level * 38)) {
          spawnEntity();
          spawnClock = 0;
        }

        entities.forEach(entity => {
          entity.z += delta * (.22 + speed * .145);
          entity.rotation += delta * 3;
          if (!entity.hit && entity.z > .71 && entity.z < .95 && Math.abs(entity.lane - carLane) < .34) {
            const y = depthY(entity.z), x = laneX(entity.lane, y);
            if (entity.kind === "candy") collectCandy(entity, x, y);
            else if (entity.kind === "heart") collectHeart(entity, x, y);
            else collide(entity, x, y);
          }
        });

        entities = entities.filter(entity => entity.z < 1.12 && !entity.hit);
        updateHud();
      }

      function render(delta, timestamp) {
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

        drawSky();
        drawDistantTown();
        drawRoad();
        drawRoadside(timestamp);
        entities.forEach(drawEntity);
        updateParticles(delta);
        drawCar();
        updatePopups(delta);

        if (flash > 0) {
          ctx.fillStyle = `rgba(255,45,55,${flash * .31})`;
          ctx.fillRect(0, 0, width, height);
        }

        if (invulnerable > 0 && Math.floor(invulnerable * 12) % 2 === 0) {
          ctx.fillStyle = "rgba(255,255,255,.065)";
          ctx.fillRect(0, 0, width, height);
        }
        ctx.restore();
      }

      function loop(timestamp) {
        const delta = Math.min(.034, (timestamp - lastFrame || 16) / 1000);
        lastFrame = timestamp;
        update(delta, timestamp);
        render(delta, timestamp);
        rafId = requestAnimationFrame(loop);
      }

      function handleKeydown(event) {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "a", "d", " "].includes(key)) event.preventDefault();
        if (gameOver) return;
        if (key === "arrowleft" || key === "a") moveLane(-1);
        if (key === "arrowright" || key === "d") moveLane(1);
        if (key === " ") startGame();
      }

      function attachControl(button, direction) {
        if (!button || button.dataset.ready) return;
        button.dataset.ready = "true";
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.classList.add("is-pressed");
          moveLane(direction);
        });
        ["pointerup", "pointercancel", "pointerleave"].forEach(type => {
          button.addEventListener(type, () => button.classList.remove("is-pressed"));
        });
      }

      canvas.addEventListener("pointerdown", event => {
        if (gameOver) return;
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        moveLane(event.clientX - rect.left < rect.width / 2 ? -1 : 1);
      });

      document.addEventListener("keydown", handleKeydown);
      attachControl(leftButton, -1);
      attachControl(rightButton, 1);
      if (restartButton) restartButton.addEventListener("click", restartGame);
      window.addEventListener("resize", resizeCanvas);
      document.addEventListener("visibilitychange", () => { paused = document.hidden || gameOver; });
      window.addEventListener("beforeunload", () => { if (rafId) cancelAnimationFrame(rafId); }, { once: true });

      resizeCanvas();
      updateHud();
      rafId = requestAnimationFrame(loop);
    })();
  </script>
 
</body></html>
